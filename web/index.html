<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>home</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --bd:#e7e4dd; --bd-soft:#f0eee9;
  --ink:#25231f; --mut:#8b877d; --faint:#b9b5aa;
  --acc:#cf4436; --acc-deep:#b03a2e; --acc-soft:#fbeeec;
  --ok:#2f7d5a; --ok-soft:#e8f4ee;
  --warn:#b05c1e; --warn-soft:#faf0e4;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}

/* ---------- sidebar ---------- */
aside{position:fixed;top:0;bottom:0;left:0;width:208px;background:var(--card);
  border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:20px 12px;z-index:10}
.brand{display:flex;align-items:center;gap:9px;padding:2px 10px 0}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none}
.brand .name{font-weight:650;font-size:15px}
.brand .sub{font-size:11px;color:var(--faint);margin:2px 10px 0 29px}
nav{margin-top:6px;overflow-y:auto}
.nav-sec{font-size:11px;color:var(--faint);letter-spacing:.1em;margin:18px 10px 5px}
nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  color:var(--ink);text-decoration:none;font-size:13.5px;margin-bottom:1px;cursor:pointer}
nav a:hover{background:#f4f2ed}
nav a.on{background:var(--acc-soft);color:var(--acc-deep);font-weight:550}
.badge{margin-left:auto;background:var(--acc);color:#fff;border-radius:9px;
  font-size:11px;min-width:18px;text-align:center;padding:0 5px;line-height:18px}
.foot{margin-top:auto;padding:8px 10px 0;font-size:11px;color:var(--faint);border-top:1px solid var(--bd-soft)}

/* ---------- main ---------- */
main{margin-left:208px;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding:28px 32px 60px}
.page-head{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.page-head h1{font-size:18px;font-weight:650}
.page-head .mut{font-size:12.5px}
.page-head .sp{flex:1}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--bd-soft)}
.row:last-child{border-bottom:none}
.mut{color:var(--mut);font-size:12.5px}
.small{font-size:12.5px}
.hidden{display:none}

h3{font-size:13px;font-weight:600;color:var(--mut);margin:16px 0 8px;letter-spacing:.02em}

/* ---------- controls ---------- */
button{padding:6px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);
  color:var(--ink);font-size:13px;font-family:inherit;cursor:pointer;transition:all .12s}
button:hover{border-color:var(--faint)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover{background:var(--acc-deep)}
button.ghost{border-color:transparent;color:var(--mut)}
button.ghost:hover{color:var(--ink);background:#f4f2ed}
button.danger{color:var(--acc)}
button.danger:hover{border-color:var(--acc)}
input,textarea,select{padding:8px 11px;border:1px solid var(--bd);border-radius:8px;
  font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--acc)}

.tag{display:inline-block;background:#f4f2ed;color:var(--mut);border-radius:6px;
  padding:1px 8px;font-size:12px;margin:1px 3px 1px 0}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}

.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:600}

pre{white-space:pre-wrap;word-break:break-word;background:#faf9f6;border:1px solid var(--bd-soft);
  padding:12px 14px;border-radius:8px;font-size:12.5px;line-height:1.6;color:var(--ink)}

/* ---------- chat ---------- */
.chatwrap{display:grid;grid-template-columns:196px 1fr;gap:14px;height:calc(100vh - 56px)}
.convlist{background:var(--card);border:1px solid var(--bd);border-radius:14px;
  padding:12px;overflow-y:auto;display:flex;flex-direction:column}
.convitem{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.convitem:hover{background:#f4f2ed}
.convitem.on{background:var(--acc-soft)}
.convitem .t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convitem.on .t{color:var(--acc-deep)}
.chatbox{display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:22px 22px 12px}
.msg{max-width:76%;padding:9px 14px;border-radius:14px;margin-bottom:10px;
  white-space:pre-wrap;word-break:break-word;line-height:1.65;font-size:14px}
.msg.user{margin-left:auto;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{background:#fff;border:1px solid var(--bd);border-bottom-left-radius:4px}
.msg.typing{color:var(--faint)}
.receipt{background:var(--ok-soft);border:1px solid #cde5d9;border-radius:10px;
  padding:8px 12px;margin:0 0 10px auto;max-width:76%;font-size:12.5px;color:var(--ok)}
.receipt .warn{color:var(--warn);background:none}
.receipt a{color:var(--acc);text-decoration:underline}
.inputrow{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--bd-soft)}
.inputrow textarea{flex:1;resize:none;height:42px;line-height:1.45}
.empty{color:var(--faint);text-align:center;margin-top:60px;font-size:13px;line-height:2}

/* ---------- drawer ---------- */
.mask{position:fixed;inset:0;background:rgba(30,28,25,.18);z-index:19}
.drawer{position:fixed;right:0;top:0;bottom:0;width:460px;background:var(--card);
  border-left:1px solid var(--bd);padding:26px 28px;overflow-y:auto;z-index:20;
  box-shadow:-6px 0 24px rgba(0,0,0,.05)}
.drawer h2{font-size:17px;font-weight:650}
.kv{display:grid;grid-template-columns:96px 1fr;gap:5px 12px;font-size:13px}
.kv>div:nth-child(odd){color:var(--mut)}
.stat{display:inline-flex;gap:16px;background:#faf9f6;border:1px solid var(--bd-soft);
  border-radius:10px;padding:10px 16px;font-size:13px}
.stat b{font-size:15px}

/* ---------- atlas ---------- */
.quiet-row{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--bd-soft)}
.quiet-row:last-child{border-bottom:none}
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="dot"></span><span class="name">home</span></div>
  <div class="sub">以人为索引的私人档案</div>
  <nav id="nav">
    <div class="nav-sec">记录</div>
    <a href="#/chat" data-r="chat">对话</a>
    <div class="nav-sec">档案</div>
    <a href="#/persons" data-r="persons">人物</a>
    <a href="#/atlas" data-r="atlas">关系星图</a>
    <div class="nav-sec">待办</div>
    <a href="#/pending" data-r="pending">待确认<span id="bdgPending" class="badge hidden"></span></a>
    <a href="#/reminders" data-r="reminders">提醒</a>
    <a href="#/notifications" data-r="notifications">通知<span id="bdgNotif" class="badge hidden"></span></a>
    <div class="nav-sec">沉淀</div>
    <a href="#/journal" data-r="journal">日志</a>
    <a href="#/skills" data-r="skills">技能</a>
  </nav>
  <div class="foot">本地运行 · 数据不出机器</div>
</aside>
<main><div class="wrap" id="main"></div></main>
<div id="overlay"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(path, opts = {}) {
  const r = await fetch(path, opts.headers ? opts : { ...opts, headers: { "Content-Type": "application/json" } });
  if (!r.ok) { const t = await r.text(); throw new Error(r.status + " " + t); }
  return r.json();
}
const j = o => JSON.stringify(o);
const fmt = s => { s = String(s || ""); return s.length >= 16 ? s.slice(5, 16).replace("T", " ") : s; };
function mdLite(s) {
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`\n]+)`/g, '<code style="background:#f4f2ed;padding:0 5px;border-radius:4px;font-size:12.5px">$1</code>');
}
const AV_COLORS = [["#fbeeec","#b03a2e"],["#eef3fb","#3a5b9e"],["#e8f4ee","#2f7d5a"],["#f6f0e4","#9a6b1f"],["#f1eefb","#6a53b7"],["#fdeef6","#a84a7d"]];
function avColor(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 997; return AV_COLORS[h % AV_COLORS.length]; }
function avatar(name, size) {
  const [bg, fg] = avColor(name);
  const s = size || 38;
  return `<span class="avatar" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.4)}px;background:${bg};color:${fg}">${esc(String(name||"?").slice(0,1))}</span>`;
}
function head(title, sub, extra) {
  return `<div class="page-head"><h1>${esc(title)}</h1>${sub?`<span class="mut">${esc(sub)}</span>`:""}<span class="sp"></span>${extra||""}</div>`;
}

/* ---------- router ---------- */
const routes = { chat: pageChat, persons: pagePersons, pending: pagePending, atlas: pageAtlas,
  reminders: pageReminders, journal: pageJournal, skills: pageSkills, notifications: pageNotifications };
function route() {
  const r = (location.hash.replace("#/", "") || "chat").split("/")[0];
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.r === r));
  closeDrawer();
  (routes[r] || pageChat)();
}
window.addEventListener("hashchange", route);

/* ---------- 对话 ---------- */
let curConv = localStorage.getItem("conv") || null;
async function pageChat() {
  const convs = (await api("/api/conversations")).conversations;
  if (!curConv && convs[0]) curConv = convs[0].id;
  $("#main").innerHTML = `
    <div class="chatwrap">
      <div class="convlist">
        <button class="primary" style="width:100%;margin-bottom:10px" onclick="newConv()">新对话</button>
        ${convs.map(c => `<div class="convitem ${c.id===curConv?"on":""}" onclick="selConv('${c.id}')">
          <div class="t">${esc(c.title)}</div><div class="mut">${fmt(c.updated_at)}</div></div>`).join("")}
      </div>
      <div class="chatbox">
        <div class="msgs" id="msgs"></div>
        <div class="inputrow">
          <input type="file" id="file" class="hidden" onchange="uploadFile(this)">
          <button class="ghost" onclick="document.getElementById('file').click()" title="上传截图 / 文档">附件</button>
          <textarea id="inp" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
          <button class="primary" onclick="sendMsg()">发送</button>
        </div>
      </div>
    </div>`;
  if (curConv) loadMsgs();
}
async function newConv() {
  const c = await api("/api/conversations", { method: "POST", body: j({}) });
  curConv = c.id; localStorage.setItem("conv", curConv); pageChat();
}
function selConv(id) { curConv = id; localStorage.setItem("conv", id); pageChat(); }
async function loadMsgs() {
  const data = await api(`/api/conversations/${curConv}/messages`);
  const box = $("#msgs");
  box.innerHTML = data.messages.map(m =>
    `<div class="msg ${m.role}">${m.role === "assistant" ? mdLite(m.content) : esc(m.content)}</div>`).join("") ||
    `<div class="empty">开始对话吧<br>试试：「老陆是 A 公司采购负责人，9/12 一起吃饭他说预算在收紧」</div>`;
  box.scrollTop = box.scrollHeight;
}
function appendMsg(role, text, cls) {
  const box = $("#msgs");
  const html = (role === "assistant" && cls !== "typing") ? mdLite(text) : esc(text);
  box.insertAdjacentHTML("beforeend", `<div class="msg ${role} ${cls||""}">${html}</div>`);
  box.scrollTop = box.scrollHeight;
}
function appendReceipts(saved, pending) {
  if ((!saved || !saved.length) && (!pending || !pending.length)) return;
  const box = $("#msgs");
  const s = (saved||[]).map(o => `已记录 ${esc(o.kind)}：${esc(o.detail)}`).join("<br>");
  const p = (pending||[]).map(o => `<span class="warn">待确认 ${esc(o.kind)}：${esc(o.detail)}（<a href="#/pending">去确认</a>）</span>`).join("<br>");
  box.insertAdjacentHTML("beforeend", `<div class="receipt">${s}${s&&p?"<br>":""}${p}</div>`);
  box.scrollTop = box.scrollHeight;
}
async function sendMsg() {
  const inp = $("#inp"), text = inp.value.trim();
  if (!text) return;
  inp.value = ""; appendMsg("user", text); appendMsg("assistant", "正在思考…", "typing");
  try {
    const r = await api(`/api/conversations/${curConv}/messages`, { method: "POST", body: j({ text }) });
    const t = document.querySelector(".msg.typing"); if (t) t.remove();
    appendMsg("assistant", r.answer);
    appendReceipts(r.saved, r.pending);
    refreshBadges();
  } catch (e) {
    const t = document.querySelector(".msg.typing"); if (t) t.remove();
    appendMsg("assistant", "出错了：" + e.message);
  }
}
async function uploadFile(input) {
  const f = input.files[0]; if (!f) return;
  appendMsg("user", `上传文件：${f.name}`);
  appendMsg("assistant", "解析中…", "typing");
  const fd = new FormData(); fd.append("file", f);
  try {
    const r = await api("/api/ingest/file", { method: "POST", body: fd, headers: {} });
    const t = document.querySelector(".msg.typing"); if (t) t.remove();
    appendMsg("assistant", `已解析（${r.status}）：\n${r.transcript || r.message || ""}`);
    appendReceipts((r.outcomes||[]).filter(o=>o.status==="ok"), (r.outcomes||[]).filter(o=>o.status==="pending"));
    refreshBadges();
  } catch (e) {
    const t = document.querySelector(".msg.typing"); if (t) t.remove();
    appendMsg("assistant", "解析失败：" + e.message);
  }
  input.value = "";
}

/* ---------- 人物 ---------- */
async function pagePersons() {
  const ps = (await api("/api/persons")).persons;
  $("#main").innerHTML = head("人物", `${ps.length} 人`, `
    <input type="file" id="chatfile" class="hidden" accept=".txt,.md,text/plain" onchange="importChatlog(this)">
    <button onclick="askChatlog()" style="margin-right:8px">导入聊天记录</button>
    <button onclick="importNames()" style="margin-right:8px">批量导入名单</button>
    <button onclick="pageArchived()">已归档</button>`) + `
    <div class="card" style="padding:6px 16px">
      ${ps.map(p => `<div class="row" onclick="personDetail('${p.id}')" style="cursor:pointer">
        ${avatar(p.display_name)}
        <div style="flex:1;min-width:0">
          <div style="font-weight:550">${esc(p.display_name)}
            ${p.aliases.slice(0,3).map(a=>`<span class="tag">${esc(a)}</span>`).join("")}</div>
          ${p.value_read ? `<div class="mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.value_read)}</div>` : ""}
        </div>
        <div class="mut" style="text-align:right;flex:none">${p.field_count} 个字段</div>
      </div>`).join("") || '<div class="row mut">还没有人物档案，去对话里提一个人试试</div>'}
    </div>`;
}
async function importNames() {
  const text = prompt("粘贴名单（每行一个名字）：");
  if (!text) return;
  const r = await api("/api/import/names", { method: "POST", body: j({ text }) });
  alert(`新建 ${r.created} 人，待确认 ${r.pending} 人，已存在/跳过 ${r.skipped} 人`);
  pagePersons(); refreshBadges();
}
function askChatlog() {
  const me = prompt("你在聊天记录里叫什么名字？（留空自动判断）", "");
  if (me === null) return;
  window.__chatlogMe = me.trim();
  document.getElementById("chatfile").click();
}
async function importChatlog(input) {
  const f = input.files[0]; if (!f) return;
  const me = window.__chatlogMe || "";
  alert(`正在导入「${f.name}」，聊天记录逐段抽取需要一点时间，完成后会提示结果。`);
  const fd = new FormData(); fd.append("file", f);
  if (me) fd.append("me", me);
  try {
    const r = await api("/api/ingest/chatlog", { method: "POST", body: fd, headers: {} });
    if (r.duplicate) { alert(r.message || "该文件已导入过"); }
    else {
      const saved = (r.outcomes || []).filter(o => o.status === "ok").length;
      const pend = (r.outcomes || []).filter(o => o.status === "pending").length;
      alert([r.transcript, `已记录 ${saved} 条，待确认 ${pend} 条`].filter(Boolean).join("\n\n"));
    }
    pagePersons(); refreshBadges();
  } catch (e) { alert("导入失败：" + e.message); }
  input.value = ""; window.__chatlogMe = "";
}
async function personDetail(pid) {
  const d = await api(`/api/persons/${pid}`);
  const fields = Object.entries(d.fields).map(([k,v]) =>
    `<div>${esc(k)}</div><div>${esc(v.value)} <span class="mut">${v.confidence}</span></div>`).join("");
  $("#overlay").innerHTML = `<div class="mask" onclick="closeDrawer()"></div>
    <div class="drawer">
      <div style="display:flex;align-items:center;gap:12px">
        ${avatar(d.person.display_name, 46)}
        <div style="flex:1"><h2>${esc(d.person.display_name)}</h2>
          <div>${d.aliases.map(a=>`<span class="tag">${esc(a)}</span>`).join("")}</div></div>
        <button class="ghost" onclick="closeDrawer()">关闭</button>
      </div>
      ${d.person.value_read ? `<div class="card" style="margin-top:14px;padding:12px 14px;font-size:13px">${esc(d.person.value_read)}</div>` : ""}
      <h3>字段</h3><div class="kv">${fields || '<div class="mut">暂无</div>'}</div>
      <h3>未闭合承诺</h3>
      ${d.open_promises.map(p=>`<div class="small" style="padding:3px 0">· ${p.who==="me"?"我":"对方"}：${esc(p.content)} <span class="mut">${fmt(p.due)}</span></div>`).join("")||'<div class="mut small">无</div>'}
      <h3>账本</h3>
      <div class="stat"><span>收 <b>${d.ledger.totals.in_cents/100}</b></span><span>支 <b>${d.ledger.totals.out_cents/100}</b></span><span class="mut">${d.ledger.totals.count} 笔</span></div>
      <div style="margin-top:6px">${d.ledger.entries.map(e=>`<div class="mut small">· ${fmt(e.when)} ${e.direction==="in"?"+":"-"}${e.amount_yuan} ${esc(e.note||"")} ${e.status==="pending"?'<span class="tag warn">待确认</span>':""}</div>`).join("")}</div>
      <h3>最近互动</h3>
      ${d.interactions.map(i=>`<div class="mut small" style="padding:3px 0">· [${fmt(i.ts)}] ${esc(i.content.slice(0,80))}</div>`).join("")||'<div class="mut small">无</div>'}
      <h3>操作</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="editField('${pid}')">编辑字段</button>
        <button onclick="mergePerson('${pid}')">合并到…</button>
        <button onclick="archivePerson('${pid}')">归档</button>
        <button class="danger" onclick="purgePerson('${pid}')">彻底清除…</button>
      </div>
    </div>`;
}
function closeDrawer() { const o = $("#overlay"); if (o) o.innerHTML = ""; }
async function editField(pid) {
  const f = prompt("字段名（如 company/title/city/birthday）："); if (!f) return;
  const v = prompt("值："); if (v === null) return;
  await api(`/api/persons/${pid}/fields`, { method: "POST", body: j({ field: f, value: v }) });
  personDetail(pid);
}
async function mergePerson(pid) {
  const other = prompt("把此人合并到（输入目标人物 ID）："); if (!other) return;
  const r = await api("/api/persons/merge", { method: "POST", body: j({ survivor_id: other, merged_id: pid }) });
  alert("已合并，merge_log_id=" + r.merge_log_id + "（可用于拆分）");
  closeDrawer(); pagePersons();
}
async function pageArchived() {
  const ps = (await api("/api/persons/archived")).persons;
  $("#main").innerHTML = head("已归档", `${ps.length} 人`, `<button onclick="pagePersons()">返回人物</button>`) + `
    <div class="card" style="padding:6px 16px">
      ${ps.map(p => `<div class="row">
        ${avatar(p.display_name)}
        <div style="flex:1;min-width:0">
          <div style="font-weight:550">${esc(p.display_name)}
            ${p.aliases.slice(0,3).map(a=>`<span class="tag">${esc(a)}</span>`).join("")}</div>
          <div class="mut small">归档于 ${fmt(p.archived_at)}</div>
        </div>
        <button onclick="restorePerson('${p.id}')" style="margin-right:6px">恢复</button>
        <button class="danger" onclick="purgePerson('${p.id}')">彻底清除…</button>
      </div>`).join("") || '<div class="row mut">没有已归档的人</div>'}
    </div>`;
}
async function archivePerson(pid) {
  if (!confirm("归档此人？（从列表与检索中消失，不会复活；之后可在「已归档」里恢复或彻底清除）")) return;
  await api(`/api/persons/${pid}`, { method: "DELETE" });
  closeDrawer(); pagePersons();
}
async function restorePerson(pid) {
  await api(`/api/persons/${pid}/restore`, { method: "POST" });
  pageArchived();
}
async function purgePerson(pid) {
  const ok = confirm("彻底清除此人？\n\n字段、别名、记忆、账本、关系边、凭证与 blob 都会被物理删除，不可恢复。\n建议先「归档」确认没问题再清除。");
  if (!ok) return;
  const typed = prompt('请输入「彻底清除」四个字确认：');
  if (typed !== "彻底清除") return;
  try {
    const r = await api(`/api/persons/${pid}/purge`, { method: "POST" });
    const parts = Object.entries(r.deleted || {}).map(([k,v]) => `${k} ${v}`).join("、");
    alert(`已彻底清除。删除行：${parts || "（无）"}；解绑：${Object.keys(r.unlinked||{}).join("、") || "无"}；blob ${(r.blobs||[]).length} 个`);
    closeDrawer(); pagePersons();
  } catch (e) {
    // FR-ID-02：校验不通过时必须报「部分删除」，不能假装删干净了
    alert("清除未通过校验：" + e.message);
    closeDrawer(); pagePersons();
  }
}

/* ---------- 待确认 ---------- */
async function pagePending() {
  const items = (await api("/api/pending")).pending;
  $("#main").innerHTML = head("待确认", items.length ? `${items.length} 项` : "") +
    (items.map(it => pendingCard(it)).join("") ||
    `<div class="card"><div class="mut">没有待确认项</div></div>`);
}
function pendingCard(it) {
  const p = it.payload;
  let body = "";
  if (it.kind === "person_identity") {
    body = `<div style="margin:8px 0 4px">提到的人：<b>${esc(p.mention)}</b>（${esc(p.canonical_name)}）</div>
      <div class="mut">候选：${(p.candidates||[]).map(c=>`${esc(c.display_name)}(${c.score})`).join("、")||"无"}</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        ${(p.candidates||[]).map(c=>`<button onclick="resolvePend('${it.id}','confirm','${c.person_id}')">是 ${esc(c.display_name)}</button>`).join("")}
        <button class="primary" onclick="resolvePend('${it.id}','confirm','new')">是新的人</button>
        <button class="danger" onclick="resolvePend('${it.id}','discard')">丢弃</button></div>`;
  } else {
    body = `<pre style="margin-top:8px">${esc(JSON.stringify(p, null, 1).slice(0, 400))}</pre>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="primary" onclick="resolvePend('${it.id}','confirm')">确认</button>
        <button class="danger" onclick="resolvePend('${it.id}','discard')">丢弃</button></div>`;
  }
  return `<div class="card" style="border-left:3px solid var(--warn)">
    <div><span class="tag warn">${esc(it.kind)}</span> <span class="mut">${esc(it.reason||"")} · ${fmt(it.created_at)}</span></div>${body}</div>`;
}
async function resolvePend(id, action, personId) {
  await api(`/api/pending/${id}/resolve`, { method: "POST", body: j({ action, person_id: personId || null }) });
  pagePending(); refreshBadges();
}

/* ---------- 星图 ---------- */
async function pageAtlas() {
  const g = await api("/api/atlas");
  const nodes = g.nodes, edges = g.edges;
  const cx = 400, cy = 280, R = 200;
  const pos = {};
  nodes.forEach((n, i) => {
    const a = 2 * Math.PI * i / Math.max(nodes.length, 1) - Math.PI / 2;
    pos[n.id] = [cx + R * Math.cos(a), cy + R * Math.sin(a)];
  });
  const svg = [
    `<svg viewBox="0 0 800 560" style="width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px">`,
    ...edges.map(e => pos[e.from_person] && pos[e.to_person] ?
      `<line x1="${pos[e.from_person][0]}" y1="${pos[e.from_person][1]}" x2="${pos[e.to_person][0]}" y2="${pos[e.to_person][1]}" stroke="#e0dcd3" stroke-width="${0.6 + (e.strength||0.5)}"/>` : ""),
    ...nodes.map(n => {
      const [x, y] = pos[n.id];
      const [bg, fg] = avColor(n.display_name);
      const r = 12 + 16 * (n.importance || 0.3);
      return `<g style="cursor:pointer" onclick="personDetail('${n.id}')">
        <circle cx="${x}" cy="${y}" r="${r}" fill="${bg}" stroke="${fg}" stroke-opacity=".35" stroke-width="1.2"/>
        <text x="${x}" y="${y + 4}" text-anchor="middle" font-size="${Math.max(11, r*0.55)}" font-weight="600" fill="${fg}">${esc(String(n.display_name).slice(0,1))}</text>
        <text x="${x}" y="${y + r + 15}" text-anchor="middle" font-size="12" fill="#8b877d">${esc(n.display_name)}</text></g>`;
    }),
    `</svg>`].join("");
  $("#main").innerHTML = head("关系星图", `${nodes.length} 人 · ${edges.length} 条边`) +
    `<div style="margin-bottom:14px">${svg}</div>
     <div class="card"><h3 style="margin-top:0">最近安静的人（14 天未互动）</h3>
     ${g.quiet.map(q => `<div class="quiet-row"><span>${esc(q.display_name)}</span><span class="mut">上次互动：${fmt(q.last_interaction)||"从未"}</span></div>`).join("") || '<div class="mut">都在联系中</div>'}</div>`;
}

/* ---------- 提醒 / 通知 / 日志 / 技能 ---------- */
async function pageReminders() {
  const rs = (await api("/api/reminders")).reminders;
  $("#main").innerHTML = head("提醒", `${rs.length} 条`) + `
    <div class="card" style="padding:6px 16px">
      ${rs.map(r => `<div class="row"><span class="tag">${esc(fmt(r.fire_at))}</span><span>${esc(r.text)}</span></div>`).join("")
        || '<div class="row mut">暂无即将到来的提醒</div>'}
    </div>`;
}
async function pageNotifications() {
  const ns = (await api("/api/notifications")).notifications;
  $("#main").innerHTML = head("通知", `${ns.length} 条`, `<button onclick="readAll()">全部已读</button>`) + `
    <div class="card" style="padding:6px 16px">
      ${ns.map(n => `<div class="row">
        <span style="width:8px;height:8px;border-radius:50%;flex:none;background:${n.read ? "var(--bd)" : "var(--acc)"}"></span>
        <span style="flex:1;${n.read ? "color:var(--mut)" : ""}">${esc(n.text)}</span>
        <span class="mut" style="flex:none">${fmt(n.created_at)}</span></div>`).join("")
        || '<div class="row mut">暂无通知</div>'}
    </div>`;
}
async function readAll() { await api("/api/notifications/read", { method: "POST", body: "{}" }); pageNotifications(); refreshBadges(); }
async function pageJournal() {
  const js = (await api("/api/journals")).journals;
  $("#main").innerHTML = head("日志", "", `<button onclick="genJournal()">生成今天的日志</button>`) +
    (js.map(x => `<div class="card"><h3 style="margin-top:0">${esc(x.day)}</h3><pre>${esc(x.text)}</pre></div>`).join("")
      || '<div class="card"><div class="mut">暂无日志</div></div>');
}
async function genJournal() {
  const r = await api("/api/jobs/journal", { method: "POST", body: j({}) });
  alert(r.text ? "已生成" : "今天还没有可记录的内容"); pageJournal();
}
async function pageSkills() {
  const ss = (await api("/api/skills")).skills;
  $("#main").innerHTML = head("技能", `${ss.length} 个`) +
    (ss.map(s => `<div class="card">
      <div style="font-weight:550">/${esc(s.name)} ${s.display_name ? `<span class="tag">${esc(s.display_name)}</span>` : ""}</div>
      ${s.trigger_hint ? `<div class="mut" style="margin:4px 0">${esc(s.trigger_hint)}</div>` : ""}
      ${s.style_notes ? `<div class="small">风格：${esc(s.style_notes)}</div>` : ""}
      ${s.body ? `<pre style="margin-top:8px">${esc(s.body.slice(0,200))}</pre>` : ""}
    </div>`).join("")
      || '<div class="card"><div class="mut">暂无。对 home 说「把这次打法存为技能」试试。</div></div>');
}

/* ---------- badges ---------- */
async function refreshBadges() {
  try {
    const p = (await api("/api/pending")).pending.length;
    const n = (await api("/api/notifications?unread=true")).notifications.length;
    const bp = $("#bdgPending"), bn = $("#bdgNotif");
    bp.textContent = p; bp.classList.toggle("hidden", !p);
    bn.textContent = n; bn.classList.toggle("hidden", !n);
  } catch (e) {}
}
route(); refreshBadges(); setInterval(refreshBadges, 30000);
</script>
